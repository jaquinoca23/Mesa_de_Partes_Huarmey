
services:
  db:
    image: postgres:17
    container_name: mesa-partes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesa_partes_huarmey
      POSTGRES_USER: mesa_partes_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/.env}
    ports:
      # Solo accesible desde tu propio equipo. Puerto 5433 para no chocar con un PostgreSQL ya instalado.
      - "127.0.0.1:5433:5432"
    volumes:
      - mesa_partes_datos:/var/lib/postgresql/data
volumes:
  mesa_partes_datos:
