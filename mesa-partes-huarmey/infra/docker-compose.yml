# PostgreSQL para desarrollo con Docker (OPCIONAL; solo la base de datos).
# Django y React se siguen ejecutando como hasta ahora, sin Docker.
#
# Uso:
#   1. Copia infra/.env.example como infra/.env y escribe una contraseña propia.
#   2. En backend/.env pon DB_HOST=localhost, DB_PORT=5433 y la MISMA contraseña.
#   3. docker compose --env-file infra/.env -f infra/docker-compose.yml up -d
#   4. Detener: docker compose -f infra/docker-compose.yml down   (los datos se conservan en el volumen)
services:
  db:
    image: postgres:17
    container_name: mesa-partes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: mesa_partes_huarmey
      POSTGRES_USER: mesa_partes_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en infra/.env}
    ports:
      # Solo accesible desde tu propio equipo. Puerto 5433 para no chocar con un PostgreSQL ya instalado.
      - "127.0.0.1:5433:5432"
    volumes:
      - mesa_partes_datos:/var/lib/postgresql/data
volumes:
  mesa_partes_datos:
